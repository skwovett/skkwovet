<!DOCTYPE html>

    <title>Maid Cafe Schedule</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f0fc;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #ffccf2;
            text-align: center;
            padding: 1rem;
        }
        header h1 {
            margin: 0;
            color: #b30086;
        }
        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 1rem;
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        .filters {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .filters label {
            font-weight: bold;
        }
        .schedule {
            border: 1px solid #ddd;
            padding: 1rem;
            border-radius: 8px;
        }
        .schedule-item {
            padding: 0.5rem 0;
            border-bottom: 1px solid #ddd;
        }
        .schedule-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
